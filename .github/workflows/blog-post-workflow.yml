name: Latest blog posts
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update the README with the latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: 'https://www.niemenjoki.fi/rss'
          max_post_count: 5
          template: '- [$title]($url?utm_source=github&utm_medium=profile&utm_content=blog) $newline'
          tag_post_pre_newline: true
